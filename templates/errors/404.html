{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div style="font-size:4rem;font-weight:700;color:var(--accent);">404</div>
  <h4 class="mt-2">Page Not Found</h4>
  <p class="text-muted">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">Go Home</a>
</div>
{% endblock %}
